name: Build Desktop Clients

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CONFIG: src-tauri/tauri.ci.conf.json

jobs:
  windows:
    name: Windows x64 client
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows client
        run: pnpm tauri build --ignore-version-mismatches --config $env:TAURI_CONFIG

      - name: Package Windows delivery archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = "src-tauri/target/release/bundle"
          $deliveryRoot = "src-tauri/target/delivery/windows-x64"
          New-Item -ItemType Directory -Force -Path $deliveryRoot | Out-Null
          Copy-Item "$bundleRoot/nsis/*.exe" $deliveryRoot -Force
          Copy-Item "$bundleRoot/msi/*.msi" $deliveryRoot -Force
          Compress-Archive -Path "$deliveryRoot/*" -DestinationPath "src-tauri/target/delivery/MaiAI-Agent-Windows-x64.zip" -Force

      - name: Upload Windows installers and archive
        uses: actions/upload-artifact@v4
        with:
          name: MaiAI-Agent-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/delivery/MaiAI-Agent-Windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS universal client
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install macOS cross-compilation targets
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          rustup target list --installed

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS universal client
        run: pnpm tauri build --target universal-apple-darwin --ignore-version-mismatches --config "$TAURI_CONFIG"

      - name: Package macOS delivery archive
        shell: bash
        run: |
          set -euxo pipefail
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          delivery_root="src-tauri/target/delivery/macos-universal"
          mkdir -p "$delivery_root"
          find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -exec cp {} "$delivery_root/" \;
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto "$app_path" "$delivery_root/$(basename "$app_path")"
          ditto -c -k "$delivery_root" "$delivery_root/../MaiAI-Agent-macOS-universal.zip"

      - name: Upload macOS packages and archive
        uses: actions/upload-artifact@v4
        with:
          name: MaiAI-Agent-macOS-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/delivery/MaiAI-Agent-macOS-universal.zip
          if-no-files-found: error

  linux:
    name: Linux x64 client
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf \
            libssl-dev rpm flatpak flatpak-builder elfutils xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zip
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux client
        run: pnpm tauri build --ignore-version-mismatches --config "$TAURI_CONFIG"

      - name: Package Linux delivery archive
        shell: bash
        run: |
          set -euxo pipefail
          bundle_root="src-tauri/target/release/bundle"
          delivery_root="src-tauri/target/delivery/linux-x64"
          mkdir -p "$delivery_root"
          find "$bundle_root/appimage" "$bundle_root/deb" "$bundle_root/rpm" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} "$delivery_root/" \;
          test -n "$(find "$delivery_root" -maxdepth 1 -type f -print -quit)"
          (cd "$delivery_root" && zip -j "../MaiAI-Agent-Linux-x64.zip" ./*)

      - name: Upload Linux packages and archive
        uses: actions/upload-artifact@v4
        with:
          name: MaiAI-Agent-Linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/delivery/MaiAI-Agent-Linux-x64.zip
          if-no-files-found: error
