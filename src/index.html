<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8ff" />
    <meta name="description" content="MaiAI Switch 配置工作台" />
    <title>MaiAI Switch Workspace</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cc-switch-theme") || "light";
          var d =
            t === "dark" ||
            (t === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
